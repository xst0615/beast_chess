<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋类大全 - 经典游戏合集</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --hover-color: #3498db;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            margin-top: 60px;
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
            margin-top: 10px;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            width: 80%;
            max-width: 800px;
            padding: 0;
            list-style: none;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
            border-color: var(--hover-color);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }

        /* 响应式设计，适配手机端 */
        @media (max-width: 600px) {
            .game-list {
                grid-template-columns: 1fr;
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 棋类大全</h1>
        <p>选择你想玩的经典棋类游戏</p>
    </div>

    <div class="game-list">
        <!-- 斗兽棋入口，假设你的斗兽棋文件名为 doushouqi.html -->
        <a href="doushouqi.html" class="game-card">
            <div class="icon">🦁</div>
            <h2 class="game-title">斗兽棋</h2>
        </a>

        <!-- 西瓜棋入口，指向我们刚才做好的 watermelon_chess.html -->
        <a href="watermelon_chess.html" class="game-card">
            <div class="icon">🍉</div>
            <h2 class="game-title">西瓜棋</h2>
        </a>
    </div>

</body>
</html>
