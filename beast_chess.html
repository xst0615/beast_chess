<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Q萌斗兽棋 - 人机对战版</title>
    <style>
        :root {
            --board-bg: #89C765;
            --water-bg: #5BC0EB;
            --trap-bg: #D4A373;
            --den-bg: #4A4E69;
            --red-color: #EF476F;
            --blue-color: #118AB2;
            --cell-size: 50px;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; touch-action: manipulation;
        }

        h1 {
            color: #333; margin: 15px 0 5px 0; font-size: 26px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .status-bar {
            display: flex; flex-direction: column; gap: 10px;
            width: 360px; margin-bottom: 10px; padding: 10px 15px;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); box-sizing: border-box;
        }

        .top-controls {
            display: flex; justify-content: space-between; align-items: center;
        }

        .turn-indicator {
            font-size: 16px; font-weight: bold; padding: 5px 12px; border-radius: 20px; transition: 0.3s;
        }
        .turn-red { background: var(--red-color); color: white; }
        .turn-blue { background: var(--blue-color); color: white; }

        .difficulty-select {
            padding: 5px; border-radius: 6px; border: 2px solid #ddd;
            font-weight: bold; outline: none; cursor: pointer;
        }

        .btn-group button {
            background: #fff; border: 2px solid #ddd; padding: 6px 12px;
            border-radius: 6px; font-size: 14px; font-weight: bold;
            cursor: pointer; margin-left: 5px; transition: 0.2s;
        }
        .btn-group button:hover:not(:disabled) { background: #f0f0f0; border-color: #ccc; }
        .btn-group button:active:not(:disabled) { transform: scale(0.95); }
        .btn-group button:disabled { opacity: 0.5; cursor: not-allowed; }

        .board-container {
            position: relative; background: #6B9054; padding: 10px;
            border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .board {
            display: grid; grid-template-columns: repeat(7, var(--cell-size));
            grid-template-rows: repeat(9, var(--cell-size)); gap: 2px;
            background: #4A6B3A; border: 2px solid #4A6B3A;
        }

        .cell {
            width: var(--cell-size); height: var(--cell-size); background-color: var(--board-bg);
            display: flex; justify-content: center; align-items: center;
            position: relative; box-sizing: border-box;
        }

        .water { background-color: var(--water-bg); }
        .water::after { content: '〰️'; opacity: 0.2; font-size: 24px; position: absolute; }
        .trap { background-color: var(--trap-bg); }
        .trap::after { content: '🕸️'; opacity: 0.4; font-size: 24px; position: absolute; }
        .den { background-color: var(--den-bg); }
        .den::after { content: '⛺'; opacity: 0.6; font-size: 24px; position: absolute; }

        .cell.valid-move { box-shadow: inset 0 0 0 3px rgba(255, 255, 0, 0.7); cursor: pointer; }
        .cell.valid-move::before {
            content: ''; position: absolute; width: 15px; height: 15px;
            background: rgba(255, 255, 0, 0.5); border-radius: 50%; z-index: 5;
        }

        .piece {
            width: 42px; height: 42px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 26px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; z-index: 10;
            transition: transform 0.2s; background: white; border: 3px solid #333;
        }
        .piece:hover { transform: scale(1.1); }
        .piece.red { border-color: var(--red-color); background: #FFE0E6; }
        .piece.blue { border-color: var(--blue-color); background: #E0F2FE; }
        .piece.selected { transform: scale(1.15); box-shadow: 0 0 10px 4px rgba(255, 255, 0, 0.8); animation: bounce 1s infinite alternate; }

        @keyframes bounce { from { transform: scale(1.15) translateY(0); } to { transform: scale(1.15) translateY(-4px); } }

        /* 特效与弹窗 */
        #fireworks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px 50px; border-radius: 15px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h2 { margin: 0 0 15px 0; font-size: 32px; }
        .modal-content p { font-size: 18px; color: #666; margin-bottom: 20px; }
        .modal-content button {
            background: var(--red-color); color: white; border: none; padding: 10px 25px;
            font-size: 18px; border-radius: 8px; cursor: pointer;
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .thinking-mask {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.3); z-index: 100; display: none;
            justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #333;
        }

        @media (max-width: 400px) { :root { --cell-size: 45px; } .status-bar { width: 320px; } .piece { width: 38px; height: 38px; font-size: 22px; } }
    </style>
</head>
<body>

    <h1>🐾 Q萌斗兽棋 - 人机版</h1>
    
    <div class="status-bar">
        <div class="top-controls">
            <div id="turn-indicator" class="turn-indicator turn-red">红方 (你) 回合</div>
            <select id="difficulty" class="difficulty-select" onchange="initGame()">
                <option value="1">🌱 入门难度 (随机)</option>
                <option value="2">⚔️ 进阶难度 (贪心)</option>
                <option value="3" selected>🔥 高阶难度 (深算)</option>
            </select>
        </div>
        <div class="top-controls btn-group">
            <div style="font-size:12px; color:#666;">回合数: <span id="turn-count">0</span>/100</div>
            <div>
                <button id="btn-undo" onclick="undo()">⬅️ 悔棋</button>
                <button onclick="initGame()">🔄 重开</button>
            </div>
        </div>
    </div>

    <div class="board-container">
        <div class="board" id="board"></div>
        <div class="thinking-mask" id="thinking-mask">🤖 蓝方思考中...</div>
    </div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2 id="win-title">🎉 红方获胜!</h2>
            <p id="win-desc">大吉大利，今晚吃鸡！</p>
            <button onclick="initGame()">再来一局</button>
        </div>
    </div>
    <canvas id="fireworks-canvas"></canvas>

<script>
    // ---------------- 配置常量 ----------------
    const ROWS = 9, COLS = 7;
    const RED = 1;  // 玩家
    const BLUE = -1; // AI

    const ANIMALS = {
        8: { name: '象', emoji: '🐘', power: 8, val: 1000 },
        7: { name: '狮', emoji: '🦁', power: 7, val: 800 },
        6: { name: '虎', emoji: '🐯', power: 6, val: 700 },
        5: { name: '豹', emoji: '🐆', power: 5, val: 500 },
        4: { name: '狼', emoji: '🐺', power: 4, val: 400 },
        3: { name: '狗', emoji: '🐶', power: 3, val: 300 },
        2: { name: '猫', emoji: '🐱', power: 2, val: 200 },
        1: { name: '鼠', emoji: '🐭', power: 1, val: 150 }
    };

    const TERRAIN = [
        ['L', 'L', 'T2', 'D2', 'T2', 'L', 'L'],
        ['L', 'L', 'L',  'T2', 'L',  'L', 'L'],
        ['L', 'L', 'L',  'L',  'L',  'L', 'L'],
        ['L', 'W', 'W',  'L',  'W',  'W', 'L'],
        ['L', 'W', 'W',  'L',  'W',  'W', 'L'],
        ['L', 'W', 'W',  'L',  'W',  'W', 'L'],
        ['L', 'L', 'L',  'L',  'L',  'L', 'L'],
        ['L', 'L', 'L',  'T1', 'L',  'L', 'L'],
        ['L', 'L', 'T1', 'D1', 'T1', 'L', 'L']
    ];

    const INITIAL_SETUP = [
        [0,0,7,BLUE], [0,6,6,BLUE], [1,1,3,BLUE], [1,5,2,BLUE],
        [2,0,1,BLUE], [2,2,5,BLUE], [2,4,4,BLUE], [2,6,8,BLUE],
        [6,0,8,RED], [6,2,4,RED], [6,4,5,RED], [6,6,1,RED],
        [7,1,2,RED], [7,5,3,RED], [8,0,6,RED], [8,6,7,RED]
    ];

    // ---------------- 游戏状态 ----------------
    let boardState = [];
    let currentPlayer = RED;
    let selectedCell = null;
    let validMoves = [];
    let history = [];
    let isGameOver = false;
    let turnWithoutCapture = 0;
    let isAITurn = false;

    // ---------------- UI 渲染 ----------------
    function initGame() {
        document.getElementById('win-modal').style.display = 'none';
        stopFireworks();
        
        boardState = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        INITIAL_SETUP.forEach(p => { boardState[p[0]][p[1]] = { type: p[2], side: p[3] }; });
        
        currentPlayer = RED;
        selectedCell = null;
        validMoves = [];
        history = [];
        isGameOver = false;
        turnWithoutCapture = 0;
        isAITurn = false;

        updateUI();
        renderBoard();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                let t = TERRAIN[r][c];
                if (t === 'W') cell.classList.add('water');
                else if (t === 'T1' || t === 'T2') cell.classList.add('trap');
                else if (t === 'D1' || t === 'D2') cell.classList.add('den');

                if (validMoves.some(m => m.r === r && m.c === c)) cell.classList.add('valid-move');

                let piece = boardState[r][c];
                if (piece) {
                    let pEl = document.createElement('div');
                    pEl.className = `piece ${piece.side === RED ? 'red' : 'blue'}`;
                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) pEl.classList.add('selected');
                    pEl.innerText = ANIMALS[piece.type].emoji;
                    cell.appendChild(pEl);
                }

                cell.onclick = () => handleCellClick(r, c);
                boardEl.appendChild(cell);
            }
        }
    }

    function updateUI() {
        const indicator = document.getElementById('turn-indicator');
        document.getElementById('turn-count').innerText = turnWithoutCapture;
        document.getElementById('btn-undo').disabled = isAITurn || history.length === 0;

        if (currentPlayer === RED) {
            indicator.textContent = '🏮 红方 (你) 回合';
            indicator.className = 'turn-indicator turn-red';
        } else {
            indicator.textContent = '❄️ 蓝方 (AI) 思考中...';
            indicator.className = 'turn-indicator turn-blue';
        }
    }

    // ---------------- 核心交互与移动 ----------------
    function handleCellClick(r, c) {
        if (isGameOver || isAITurn || currentPlayer !== RED) return;
        let piece = boardState[r][c];

        if (selectedCell && validMoves.some(m => m.r === r && m.c === c)) {
            executeMove(selectedCell.r, selectedCell.c, r, c);
            return;
        }
        if (piece && piece.side === currentPlayer) {
            selectedCell = { r, c };
            validMoves = getValidMovesForPiece(boardState, r, c);
            renderBoard();
            return;
        }
        selectedCell = null; validMoves = []; renderBoard();
    }

    function executeMove(fromR, fromC, toR, toC) {
        let piece = boardState[fromR][fromC];
        let targetPiece = boardState[toR][toC];

        // 记录深拷贝历史用于悔棋
        history.push({
            board: JSON.parse(JSON.stringify(boardState)),
            turn: currentPlayer,
            noCapture: turnWithoutCapture
        });

        boardState[toR][toC] = piece;
        boardState[fromR][fromC] = null;
        turnWithoutCapture = targetPiece ? 0 : turnWithoutCapture + 1;

        selectedCell = null; validMoves = [];
        let win = checkWinCondition(boardState, toR, toC, piece, targetPiece);
        
        if (!win) {
            currentPlayer *= -1;
            updateUI();
            renderBoard();
            
            if (currentPlayer === BLUE) {
                isAITurn = true;
                document.getElementById('thinking-mask').style.display = 'flex';
                setTimeout(makeAIMove, 100); // 让UI有时间渲染
            } else {
                isAITurn = false;
                document.getElementById('thinking-mask').style.display = 'none';
            }
        } else {
            renderBoard();
        }
    }

    function undo() {
        if (history.length < 2 || isGameOver || isAITurn) return;
        // 弹出两次以回到玩家回合
        history.pop(); // 弹出玩家的走法
        let previousState = history.pop(); // 弹出AI的走法
        
        boardState = previousState.board;
        currentPlayer = previousState.turn;
        turnWithoutCapture = previousState.noCapture;
        selectedCell = null; validMoves = [];
        updateUI(); renderBoard();
    }

    // ---------------- 规则与移动生成 ----------------
    function getValidMovesForPiece(board, r, c) {
        let moves = [];
        let piece = board[r][c];
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        
        for (let d of dirs) {
            let nr = r + d[0], nc = c + d[1];
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                if (isValidStep(board, r, c, nr, nc, piece)) {
                    moves.push({ r: nr, c: nc });
                }
            }
            // 狮虎跳河
            if ((piece.type === 6 || piece.type === 7) && TERRAIN[nr]?.[nc] === 'W') {
                let jumpPos = calculateRiverJump(board, r, c, d[0], d[1]);
                if (jumpPos && isValidStep(board, r, c, jumpPos.r, jumpPos.c, piece, true)) {
                    moves.push({ r: jumpPos.r, c: jumpPos.c });
                }
            }
        }
        return moves;
    }

    function calculateRiverJump(board, r, c, dr, dc) {
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && TERRAIN[nr][nc] === 'W') {
            if (board[nr][nc] !== null) return null; // 被水中的老鼠阻挡
            nr += dr; nc += dc;
        }
        return (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) ? { r: nr, c: nc } : null;
    }

    function isValidStep(board, r1, c1, r2, c2, piece, isJump = false) {
        let tTerrain = TERRAIN[r2][c2];
        let tPiece = board[r2][c2];

        // 己方兽穴不可入
        if ((piece.side === RED && tTerrain === 'D1') || (piece.side === BLUE && tTerrain === 'D2')) return false;
        // 非老鼠不能下水
        if (!isJump && tTerrain === 'W' && piece.type !== 1) return false;

        if (tPiece) {
            if (tPiece.side === piece.side) return false; // 不吃自己
            // 陷阱规则：敌方在己方陷阱中，无视大小
            if ((tTerrain === 'T1' && tPiece.side === BLUE) || (tTerrain === 'T2' && tPiece.side === RED)) return true;
            // 水陆隔离规则：水不能打陆地，陆地不能打水 (除非鼠吃鼠)
            if (TERRAIN[r1][c1] === 'W' !== (tTerrain === 'W')) return false;
            // 鼠吃象
            if (piece.type === 1 && tPiece.type === 8) return true;
            if (piece.type === 8 && tPiece.type === 1) return false;
            // 常规压制
            if (piece.type < tPiece.type) return false;
        }
        return true;
    }

    function checkWinCondition(board, r, c, piece, tPiece) {
        if ((piece.side === RED && TERRAIN[r][c] === 'D2') || (piece.side === BLUE && TERRAIN[r][c] === 'D1')) {
            triggerWin(piece.side, "直捣黄龙！成功占领敌方兽穴！"); return true;
        }
        let enemies = 0, myMoves = 0;
        for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
                let p = board[i][j];
                if (p && p.side !== piece.side) enemies++;
                if (p && p.side === piece.side) myMoves += getValidMovesForPiece(board, i, j).length;
            }
        }
        if (enemies === 0) { triggerWin(piece.side, "天下无敌！全歼敌方所有动物！"); return true; }
        // 困毙检查由下一回合的AI或玩家接管，这里为了简单起见
        if (turnWithoutCapture >= 100) { triggerWin(0, "连续100回合无吃子，和平使者降临！"); return true; }
        return false;
    }

    function triggerWin(winner, desc) {
        isGameOver = true; isAITurn = false;
        document.getElementById('thinking-mask').style.display = 'none';
        const title = document.getElementById('win-title');
        if (winner === RED) { title.innerHTML = '🎉 红方 (你) 大获全胜!'; title.style.color = 'var(--red-color)'; startFireworks(); }
        else if (winner === BLUE) { title.innerHTML = '💀 蓝方 (AI) 获胜!'; title.style.color = 'var(--blue-color)'; }
        else { title.innerHTML = '🤝 平局!'; title.style.color = '#333'; }
        
        document.getElementById('win-desc').innerText = desc;
        document.getElementById('win-modal').style.display = 'flex';
    }

    // ---------------- AI 核心算法 ----------------
    function makeAIMove() {
        if (isGameOver) return;
        let diff = parseInt(document.getElementById('difficulty').value);
        let bestMove = null;

        if (diff === 1) {
            // 入门：随机合法步
            let allMoves = getAllMoves(boardState, BLUE);
            if(allMoves.length > 0) bestMove = allMoves[Math.floor(Math.random() * allMoves.length)];
        } 
        else if (diff === 2) {
            // 进阶：深度1贪心搜索
            bestMove = getGreedyMove(boardState, BLUE);
        }
        else {
            // 高阶：Minimax (深度2-3，受限于浏览器性能，这里取深度3的轻量裁剪)
            bestMove = getMinimaxMove(boardState, BLUE, 3);
        }

        if (bestMove) {
            executeMove(bestMove.fr, bestMove.fc, bestMove.tr, bestMove.tc);
        } else {
            triggerWin(RED, "瓮中之鳖！AI已无路可走被困死！");
        }
    }

    function getAllMoves(board, side) {
        let moves = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] && board[r][c].side === side) {
                    let vMoves = getValidMovesForPiece(board, r, c);
                    vMoves.forEach(m => moves.push({ fr: r, fc: c, tr: m.r, tc: m.c }));
                }
            }
        }
        return moves;
    }

    function getGreedyMove(board, side) {
        let allMoves = getAllMoves(board, side);
        let bestScore = -Infinity;
        let bestMoves = [];
        
        for (let move of allMoves) {
            let simBoard = JSON.parse(JSON.stringify(board));
            simBoard[move.tr][move.tc] = simBoard[move.fr][move.fc];
            simBoard[move.fr][move.fc] = null;
            let score = evaluateBoard(simBoard, side);
            
            if (score > bestScore) { bestScore = score; bestMoves = [move]; }
            else if (score === bestScore) { bestMoves.push(move); }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    function getMinimaxMove(board, side, depth) {
        let allMoves = getAllMoves(board, side);
        let bestScore = -Infinity;
        let bestMove = allMoves[0];

        // 加入基础排序(捕获优先)，提升剪枝效率
        allMoves.sort((a, b) => (board[b.tr][b.tc] ? 1 : 0) - (board[a.tr][a.tc] ? 1 : 0));

        for (let move of allMoves) {
            let simBoard = JSON.parse(JSON.stringify(board));
            simBoard[move.tr][move.tc] = simBoard[move.fr][move.fc];
            simBoard[move.fr][move.fc] = null;
            
            let score = minimax(simBoard, depth - 1, -Infinity, Infinity, false, side);
            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }
        return bestMove;
    }

    function minimax(board, depth, alpha, beta, isMaximizing, aiSide) {
        if (depth === 0) return evaluateBoard(board, aiSide);
        
        let currentSide = isMaximizing ? aiSide : -aiSide;
        let moves = getAllMoves(board, currentSide);
        
        if (moves.length === 0) return isMaximizing ? -99999 : 99999; // 困毙

        if (isMaximizing) {
            let maxEval = -Infinity;
            for (let move of moves) {
                let simBoard = JSON.parse(JSON.stringify(board));
                simBoard[move.tr][move.tc] = simBoard[move.fr][move.fc];
                simBoard[move.fr][move.fc] = null;
                let ev = minimax(simBoard, depth - 1, alpha, beta, false, aiSide);
                maxEval = Math.max(maxEval, ev);
                alpha = Math.max(alpha, ev);
                if (beta <= alpha) break;
            }
            return maxEval;
        } else {
            let minEval = Infinity;
            for (let move of moves) {
                let simBoard = JSON.parse(JSON.stringify(board));
                simBoard[move.tr][move.tc] = simBoard[move.fr][move.fc];
                simBoard[move.fr][move.fc] = null;
                let ev = minimax(simBoard, depth - 1, alpha, beta, true, aiSide);
                minEval = Math.min(minEval, ev);
                beta = Math.min(beta, ev);
                if (beta <= alpha) break;
            }
            return minEval;
        }
    }

    function evaluateBoard(board, aiSide) {
        let score = 0;
        let aiDen = aiSide === RED ? 'D1' : 'D2';
        let oppDen = aiSide === RED ? 'D2' : 'D1';

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let piece = board[r][c];
                if (piece) {
                    let val = ANIMALS[piece.type].val;
                    // 阵营基础分
                    let pieceScore = val; 
                    
                    // 阵地分：越靠近敌方基地分数越高
                    let distToOppDen = Math.abs(r - (oppDen === 'D1' ? 8 : 0));
                    pieceScore += (8 - distToOppDen) * 10;
                    
                    // 胜利极值
                    if (TERRAIN[r][c] === oppDen) pieceScore += 100000;
                    
                    if (piece.side === aiSide) score += pieceScore;
                    else score -= pieceScore;
                }
            }
        }
        return score;
    }

    // ---------------- 烟花特效 ----------------
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [], fireworksAnimId = null;

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    function createFirework(x, y) {
        const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#073B4C'];
        for (let i = 0; i < 40; i++) {
            const angle = Math.random() * Math.PI * 2, speed = Math.random() * 5 + 2;
            particles.push({
                x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1, color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1, decay: Math.random() * 0.02 + 0.015
            });
        }
    }

    function animateFireworks() {
        if (!isGameOver) return;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (Math.random() < 0.08) createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.5);

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= p.decay;
            if (p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.fill();
        }
        ctx.globalAlpha = 1;
        fireworksAnimId = requestAnimationFrame(animateFireworks);
    }

    function startFireworks() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles = []; animateFireworks(); }
    function stopFireworks() { if (fireworksAnimId) cancelAnimationFrame(fireworksAnimId); ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // 启动
    initGame();
</script>
