<script>
/* ================= 共享存储 ================= */
const Store = {
    get(k, def){ try{ const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; }catch(e){ return def; } },
    set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
};
function addStar(n){ Store.set('learn_stars', Store.get('learn_stars', 0) + n); }
function getLearned(){ return Store.get('learn_chinese_learned', []); }
function setLearned(a){ Store.set('learn_chinese_learned', a); }
function syncProgress(){ const p = Store.get('learn_progress', {chinese:0,pinyin:0,math:0,english:0}); p.chinese = getLearned().length; Store.set('learn_progress', p); }
function dailyCheckin(){
    const s = Store.get('learn_streak', {days:0, lastDate:null});
    const today = new Date().toDateString();
    if (s.lastDate === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    s.days = (s.lastDate === yesterday) ? s.days + 1 : 1;
    s.lastDate = today;
    Store.set('learn_streak', s);
}
function awardBadge(id){ const b = Store.get('learn_badges', []); if(!b.includes(id)){ b.push(id); Store.set('learn_badges', b); } }
function wrongList(){ return Store.get('learn_wrong', []).filter(x => x.module === 'chinese'); }
function addWrong(id){
    const w = Store.get('learn_wrong', []);
    if(!w.find(x => x.module==='chinese' && x.id===id)){ w.push({module:'chinese', id, addedAt:Date.now()}); Store.set('learn_wrong', w); }
}
function removeWrong(id){
    const w = Store.get('learn_wrong', []).filter(x => !(x.module==='chinese' && x.id===id));
    Store.set('learn_wrong', w);
}
function isWrong(id){ return wrongList().some(x => x.id === id); }
function getFav(){ return Store.get('learn_chinese_fav', []); }
function toggleFav(id){
    let f = getFav();
    if(f.includes(id)) f = f.filter(x => x !== id); else f.push(id);
    Store.set('learn_chinese_fav', f);
    return f.includes(id);
}

/* ================= 语音工具 ================= */
const Voice = {
    speak(text, lang = 'zh-CN', rate = 0.9){
        if(!('speechSynthesis' in window)){ alert('您的浏览器不支持语音朗读，请用 Chrome'); return false; }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang; u.rate = rate;
        window.speechSynthesis.speak(u);
        return true;
    },
    listen(lang = 'zh-CN', onResult, onEnd){
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ alert('您的浏览器不支持语音识别，请用 Chrome 浏览器'); onResult(null); return false; }
        const r = new SR();
        r.lang = lang; r.continuous = false; r.interimResults = false; r.maxAlternatives = 3;
        r.onresult = e => onResult(e.results[0][0].transcript);
        r.onerror = () => onResult(null);
        r.onend = () => onEnd && onEnd();
        r.start();
        return true;
    },
    score(target, heard){
        if(!heard) return 0;
        if(heard.includes(target) || target.includes(heard)) return 2;
        const t = [...target], h = [...heard];
        const common = t.filter(c => h.includes(c)).length;
        return common / Math.max(1, t.length) > 0.5 ? 1 : 0;
    }
};

/* 字 id 与全局索引映射 */
const FLAT = []; // {c,p,w,s,o, l, ci, gid}
LESSONS.forEach((arr, li) => arr.forEach((ch, ci) => {
    const gid = 'char-' + String(FLAT.length + 1).padStart(3, '0');
    FLAT.push(Object.assign({}, ch, { l: li, ci, gid }));
}));
const ID2POS = {}; FLAT.forEach(o => ID2POS[o.gid] = o);

/* SVG 笔顺（7 个高频字：一、二、三、人、口、日、月） */
const STROKES = {
    '一': [{d:'M20 100 L180 100'}],
    '二': [{d:'M55 70 L145 70'},{d:'M20 135 L180 135'}],
    '三': [{d:'M70 55 L130 55'},{d:'M30 100 L170 100'},{d:'M20 145 L180 145'}],
    '人': [{d:'M100 25 Q70 100 35 175'},{d:'M100 70 Q130 120 170 175'}],
    '口': [{d:'M55 45 L55 155'},{d:'M55 45 L145 45 L145 155'},{d:'M55 155 L145 155'}],
    '日': [{d:'M50 35 L50 165'},{d:'M50 35 L150 35 L150 165'},{d:'M50 100 L150 100'},{d:'M50 165 L150 165'}],
    '月': [{d:'M75 30 Q65 100 60 170'},{d:'M75 30 L150 30 L150 160 L145 168'},{d:'M75 95 L150 95'},{d:'M75 140 L150 140'}],
};
const COLORS = ['#e91e63','#3f51b5','#009688','#ff9800','#795548','#9c27b0','#43a047','#00bcd4'];
function strokeSVG(ch){
    const data = STROKES[ch];
    if(!data) return '';
    let inner = '';
    data.forEach((s, i) => {
        const col = COLORS[i % COLORS.length];
        inner += `<path d="${s.d}" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
        const m = s.d.match(/M([\d.]+)\s+([\d.]+)/);
        if(m){
            const x = +m[1], y = +m[2];
            inner += `<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="${col}" stroke-width="2"/>`;
            inner += `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="16" font-weight="bold" fill="${col}">${i+1}</text>`;
        }
    });
    return `<div class="stroke-box"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${inner}</svg><div class="stroke-tip">不同颜色表示笔顺，数字为先后</div></div>`;
}

/* ================= 状态 ================= */
let pos = Store.get('learn_chinese_pos', { l: 0, c: 0 });
if(!LESSONS[pos.l] || !LESSONS[pos.l][pos.c]) pos = { l: 0, c: 0 };
let reviewMode = false;
let advanceTimer = null;
const $ = id => document.getElementById(id);

function curChar(){ return LESSONS[pos.l][pos.c]; }
function curGid(){ const f = FLAT.find(o => o.l === pos.l && o.ci === pos.c); return f ? f.gid : null; }

/* 进入时若存在错题，跳到第一个错题 */
(function initReview(){
    const w = wrongList();
    if(w.length){
        const p = ID2POS[w[0].id];
        if(p){ pos = { l: p.l, c: p.ci }; reviewMode = true; }
    }
})();

function savePos(){ Store.set('learn_chinese_pos', pos); }

function render(){
    const ch = curChar();
    const gid = curGid();
    const learned = getLearned();
    const stars = Store.get('learn_stars', 0);
    const fav = getFav();
    const wrong = isWrong(gid);

    $('meta').innerHTML =
        `第 <b>${pos.l + 1}</b>/40 课 · 已学 <b>${learned.length}</b> 字 · ⭐ <b>${stars}</b> · 📌 <b>${fav.length}</b>` +
        (reviewMode ? ` · <span class="review-flag">错题复习中</span>` : '');

    const isNew = !learned.includes(gid);
    $('card').innerHTML = `
        <div class="lesson-tag">第 <b>${pos.l+1}</b> 课 · ${isNew ? '新字' : '复习'} ${reviewMode ? '<span class="review-flag">错题</span>' : ''}</div>
        <div class="big-char">${ch.c}</div>
        <div class="pinyin">${ch.p}</div>
        ${strokeSVG(ch.c)}
        <div class="order"><b>笔顺：</b>${ch.o}</div>
        <div class="section-title">📖 组词（点 🔊 朗读）</div>
        <div class="word-row">
            <button class="word-btn" data-w="${ch.w[0]}">${ch.w[0]} 🔊</button>
            <button class="word-btn" data-w="${ch.w[1]}">${ch.w[1]} 🔊</button>
        </div>
        <div class="section-title">✏️ 例句</div>
        <button class="sent-btn" data-sent="1"><span class="txt">${ch.s}</span> 🔊</button>
        <div class="ops">
            <button class="op-btn op-listen" id="listenBtn">🔊 听字音</button>
            <button class="op-btn op-read" id="readBtn">🎤 我来读</button>
        </div>
        <div class="feedback" id="feedback">${isNew ? '👆 点「听字音」再「我来读」跟读' : '继续练习，可重复读'}</div>
        <div class="hint">${wrong ? '📌 此字在错题本中，读对即可移除' : ''}</div>
    `;

    // 绑定卡片内按钮
    document.querySelectorAll('.word-btn').forEach(b => b.addEventListener('click', () => Voice.speak(b.dataset.w)));
    const sb = document.querySelector('.sent-btn'); if(sb) sb.addEventListener('click', () => Voice.speak(ch.s));
    $('listenBtn').addEventListener('click', () => Voice.speak(ch.c));
    $('readBtn').addEventListener('click', startRead);

    // 收藏按钮状态
    const favBtn = $('favBtn');
    if(fav.includes(gid)) favBtn.classList.add('on'); else favBtn.classList.remove('on');

    renderLessonList();
}

function setFb(html){ $('feedback').innerHTML = html; }

function startRead(){
    const ch = curChar();
    const btn = $('readBtn');
    btn.classList.add('busy'); btn.textContent = '🎤 听讲中…';
    setFb('🎤 请大声读出「' + ch.c + '」');
    Voice.listen('zh-CN', heard => {
        btn.classList.remove('busy'); btn.textContent = '🎤 我来读';
        if(!heard){ setFb('🟡 没听清，请再试一次或点听字音'); return; }
        const sc = Voice.score(ch.c, heard);
        handleScore(sc, heard);
    });
}

function handleScore(sc, heard){
    const ch = curChar();
    const gid = curGid();
    if(sc === 2){
        let earned = false;
        // 移出错题
        if(isWrong(gid)){ removeWrong(gid); }
        // 新字 → 记已学 + 星 + 进度 + 打卡 + 勋章
        const learned = getLearned();
        if(!learned.includes(gid)){
            learned.push(gid); setLearned(learned);
            syncProgress();
            addStar(1);
            dailyCheckin();
            if(learned.length >= 50) awardBadge('char_50');
            earned = true;
        }
        setFb(earned ? '✅ 太棒了！+1 ⭐' : '✅ 太棒了！复习成功');
        clearTimeout(advanceTimer);
        advanceTimer = setTimeout(() => goNext(), 3000);
    } else if(sc === 1){
        setFb('🟡 差一点，再试一次（听到：' + heard + '）');
    } else {
        addWrong(gid);
        setFb('❌ 没读对，已加入错题本（听到：' + heard + '）。可重试或跳过');
    }
}

function goNext(){
    clearTimeout(advanceTimer);
    pos.c++;
    if(pos.c >= LESSONS[pos.l].length){ pos.l++; pos.c = 0; }
    if(pos.l >= LESSONS.length){ pos.l = 0; pos.c = 0; } // 学完循环
    reviewMode = false; savePos(); render();
    setTimeout(() => Voice.speak(curChar().c), 250);
}
function goPrev(){
    clearTimeout(advanceTimer);
    pos.c--;
    if(pos.c < 0){ pos.l--; if(pos.l < 0) pos.l = LESSONS.length - 1; pos.c = LESSONS[pos.l].length - 1; }
    reviewMode = false; savePos(); render();
    setTimeout(() => Voice.speak(curChar().c), 250);
}
function jumpTo(l, c){
    clearTimeout(advanceTimer);
    pos = { l, c }; reviewMode = false; savePos();
    $('lessonlist').hidden = true;
    render();
    setTimeout(() => Voice.speak(curChar().c), 250);
}
function toggleFavBtn(){
    const on = toggleFav(curGid());
    const b = $('favBtn'); if(on) b.classList.add('on'); else b.classList.remove('on');
}

function renderLessonList(){
    const learned = getLearned();
    const cells = LESSONS.map((arr, li) => {
        const firstChar = arr[0].c;
        const doneCount = arr.filter((_, ci) => learned.includes(FLAT.find(o => o.l === li && o.ci === ci).gid)).length;
        const isCur = li === pos.l;
        const cls = ['ll-cell' + (isCur ? ' cur' : '') + (doneCount === arr.length ? ' done' : '')];
        return `<button class="${cls.join(' ')}" data-l="${li}"><span class="ln">${li+1}课 ${doneCount}/${arr.length}</span>${firstChar}</button>`;
    }).join('');
    $('llGrid').innerHTML = cells;
    document.querySelectorAll('.ll-cell').forEach(b => b.addEventListener('click', () => jumpTo(+b.dataset.l, 0)));
}

/* 绑定 */
$('prevBtn').addEventListener('click', goPrev);
$('nextBtn').addEventListener('click', goNext);
$('favBtn').addEventListener('click', toggleFavBtn);
$('menuBtn').addEventListener('click', () => { const el = $('lessonlist'); el.hidden = !el.hidden; });

/* 首次渲染 */
render();
setTimeout(() => Voice.speak(curChar().c), 400);
</script>
