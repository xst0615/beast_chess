<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学思维 · 40 课</title>
<style>
    :root {
        --primary: #e91e63;
        --primary-dark: #c2185b;
        --bg: linear-gradient(135deg, #fff3e0 0%, #fce4ec 100%);
        --card: #fff;
        --success: #43a047;
        --error: #e53935;
        --accent: #ffca28;
        --shadow: 0 4px 12px rgba(233,30,99,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        min-height: 100vh; padding: 12px 12px 28px;
        display: flex; flex-direction: column; align-items: center;
    }
    .back-link {
        position: absolute; top: 12px; left: 12px; color: var(--primary);
        text-decoration: none; font-size: 14px; background: #fff;
        padding: 7px 12px; border-radius: 20px; box-shadow: var(--shadow);
        min-height: 32px; display: flex; align-items: center;
    }
    h1 {
        color: var(--primary); font-size: 24px; margin: 10px 0 6px;
        letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.08);
    }
    .progress-info {
        font-size: 14px; color: #666; background: #fff; padding: 6px 14px;
        border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 12px;
    }
    .progress-info b { color: var(--primary); }
    .progress-info .cat-name { color: var(--primary); font-weight: bold; }

    .stage {
        background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
        padding: 18px 16px; width: 100%; max-width: 560px;
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        border: 3px solid #f8bbd0;

    .cat-tag {

    }
    .stem {
        font-size: 19px; color: #333; text-align: center; line-height: 1.5;

    }
    .emoji-box {
        font-size: 42px; line-height: 1.4; text-align: center; min-height: 52px;
        word-break: break-word; letter-spacing: 2px; color: var(--primary);
        padding: 6px 4px; width: 100%;

    .emoji-box.shape { font-size: 72px; line-height: 1.1; }
    .emoji-box.small { font-size: 30px; }

    .read-btn:hover { background: #ffe0b2; transform: translateY(-1px); }
    .read-btn:active { transform: translateY(0); }

    .options {

    .opt {
        background: #fff; border: 3px solid #f0f0f0; border-radius: 14px;
        padding: 14px 8px; font-size: 20px; font-weight: bold; color: #333;
        cursor: pointer; font-family: inherit; min-height: 56px;

    .opt.correct { border-color: var(--success); background: #c8e6c9; color: #2e7d32; }
    .opt.wrong { border-color: var(--error); background: #ffcdd2; color: #c62828; animation: shake 0.4s; }
    .opt.disabled { opacity: 0.6; cursor: default; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    .feedback {
        font-size: 18px; font-weight: bold; min-height: 26px; text-align: center;
    }
    .feedback.ok { color: var(--success); }
    .feedback.no { color: var(--error); }

    .after-correct {

    .btn-answer:hover { background: #ffb300; transform: translateY(-1px); }
    .btn-mic { background: #ba68c8; color: #fff; }
    .btn-mic:hover { background: #9c27b0; transform: translateY(-1px); }
    .btn-mic.rec { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

    .nav {
        display: flex; gap: 10px; width: 100%; max-width: 560px; margin-top: 14px;
    }
    .nav button {

    .btn-prev { background: #eceff1; color: #555; }
    .btn-prev:hover { background: #cfd8dc; }
    .btn-next { background: var(--primary); color: #fff; }
    .btn-next:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-next:disabled, .btn-prev:disabled { opacity: 0.45; cursor: not-allowed; }

        margin-top: 12px; font-size: 14px; color: #666; background: #fff;

    }

    .lesson-dots {

        .emoji-box { font-size: 36px; }
        .emoji-box.shape { font-size: 60px; }

<script>
// ================= 共享存储（与 learning_hub.html 一致） =================
const Store = {
    get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; } catch(e) { return def; } },
    set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
    addStar(n = 1) { const s = (Store.get('learn_stars', 0)) + n; Store.set('learn_stars', s); return s; },
    addProgress(m, n = 1) { const p = Store.get('learn_progress', {chinese:0,pinyin:0,math:0,english:0}); p[m] = (p[m]||0) + n; Store.set('learn_progress', p); return p; },
    addWrong(m, id) { const w = Store.get('learn_wrong', []); if (!w.find(x => x.module===m && x.id===id)) { w.push({module:m, id, addedAt:Date.now()}); Store.set('learn_wrong', w); } },
    removeWrong(m, id) { const w = Store.get('learn_wrong', []).filter(x => !(x.module===m && x.id===id)); Store.set('learn_wrong', w); },
    dailyCheckin() { const s = Store.get('learn_streak', {days:0, lastDate:null}); const t = new Date().toDateString(); if (s.lastDate===t) return s; const y = new Date(Date.now()-86400000).toDateString(); s.days = (s.lastDate===y) ? s.days+1 : 1; s.lastDate = t; Store.set('learn_streak', s); return s; },
    awardBadge(id) { const b = Store.get('learn_badges', []); if (!b.includes(id)) { b.push(id); Store.set('learn_badges', b); } },
};

// ================= 浏览器兼容提示（软 toast，替代 alert） =================
function showToast(msg) {
    let t = document.getElementById('__toast');
    if (!t) {
        t = document.createElement('div');
        t.id = '__toast';
        t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.82);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:9999;max-width:80vw;text-align:center;line-height:1.5;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.transition = 'opacity 0.3s'; t.style.opacity = '0'; }, 2500);
}

// ================= 录音回放（让孩子听自己声音） =================
function showPlayback(url) {
    let box = document.getElementById('__playback');
    if (!box) {
        box = document.createElement('div');
        box.id = '__playback';
        box.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #e91e63;border-radius:14px;padding:10px 14px;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,0.2);display:flex;align-items:center;gap:10px;max-width:90vw;';
        document.body.appendChild(box);
    }
    box.innerHTML = '';
    const lbl = document.createElement('span');
    lbl.textContent = '🎵 听自己读';
    lbl.style.cssText = 'font-size:13px;color:#e91e63;font-weight:bold;white-space:nowrap;';
    const audio = document.createElement('audio');
    audio.src = url; audio.controls = true;
    audio.style.cssText = 'height:32px;max-width:200px;';
    const close = document.createElement('button');
    close.textContent = '✕';
    close.style.cssText = 'background:#eee;border:none;width:26px;height:26px;border-radius:13px;cursor:pointer;font-size:14px;';
    close.onclick = () => { box.style.display = 'none'; };
    box.appendChild(lbl); box.appendChild(audio); box.appendChild(close);
    box.style.display = 'flex';
}

// ================= 语音工具 =================
const Voice = {
    speak(text, lang = 'zh-CN', rate = 0.9, opts = {}) {
        window.speechSynthesis && window.speechSynthesis.cancel();
        if(window.AudioManifest && window.AudioManifest[text]){
            try{
                const a = new Audio('audio/' + window.AudioManifest[text]);
                if(opts && opts.onEnd) a.addEventListener('ended', () => opts.onEnd());
                a.addEventListener('error', () => this._tts(text, lang, rate, opts));
                a.play().catch(() => this._tts(text, lang, rate, opts));
                return true;
            }catch(e){}
        }
        return this._tts(text, lang, rate, opts);
    },
    _tts(text, lang = 'zh-CN', rate = 0.9, opts = {}) {
        if (!('speechSynthesis' in window)) { showToast('浏览器不支持朗读，可看题跟做'); return false; }
        window.speechSynthesis.cancel();
        const voices = window.speechSynthesis.getVoices() || [];
        // 女声匹配（兼容百度/QQ 等浏览器内置女声）
        const femaleHints = lang.startsWith('zh')
            ? ['婷婷','Google 普通话','Tingting','Yaoyao','Meijia','晓晓','晓秋','晓伊','晓梦','云夏','云扬','云希','云杰','Xiaoxiao','Xiaoyi','Xiaomeng','Yunyang','Yunxi','Huihui','Kangkang']
            : ['Samantha','Google US English','Karen','Moira','Tessa','Fiona','Jenny','Aria','Jessa','Zira','Michelle','female','Female','女声'];
        const langHints = lang.startsWith('zh') ? ['zh-CN','zh_CN','zh','cmn'] : ['en-US','en_US','en','en-GB'];
        let v = voices.find(x => femaleHints.some(h => (x.name||'').includes(h)));
        if(!v) v = voices.find(x => /female|女声|woman|girl/i.test(x.name||''));
        if(!v) v = voices.find(x => femaleHints.some(h => (x.lang||'').includes(h)) || langHints.some(h => (x.lang||'').includes(h) && /female|女/i.test(x.name||'')));
        if(!v) v = voices.find(x => langHints.some(h => (x.lang||'') === h || (x.lang||'').startsWith(h.split('-')[0])));
        const queue = [];
        if(opts.intro) queue.push({ t: opts.intro, p: 1.32, r: 1.0, gap: 220 });
        const parts = text.match(/[^。！？，；,.!?;]+[。！？，；,.!?;]?/g) || [text];
        parts.forEach(seg => {
            const s = seg.trim(); if(!s) return;
            const last = s.slice(-1);
            let p = 1.16, gap = 130;
            if(/[？?]/.test(last)){ p = 1.42; gap = 250; }
            else if(/[！!]/.test(last)){ p = 1.30; gap = 230; }
            else if(/[。.]/.test(last)){ p = 1.06; gap = 280; }
            else { p = 1.20; gap = 110; }
            queue.push({ t: s, p, r: rate * 0.92, gap });
        });
        if(opts.praise) queue.push({ t: opts.praise, p: 1.38, r: 0.95, gap: 0 });
        const play = (i) => {
            if(i >= queue.length){ opts.onEnd && opts.onEnd(); return; }
            const it = queue[i];
            const u = new SpeechSynthesisUtterance(it.t);
            u.lang = lang; u.rate = it.r; u.pitch = it.p;
            if(v) u.voice = v;
            u.onend = () => setTimeout(() => play(i+1), it.gap);
            u.onerror = () => play(i+1);
            opts.onSeg && opts.onSeg(it.t, i);
            window.speechSynthesis.speak(u);
        };
        play(0);
        return true;
    },
    listen(lang = 'zh-CN', onResult, onEnd) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            this._recordOnly(onEnd);
            showToast('当前浏览器不支持语音识别，录音可自己听');
            onResult(null);
            return false;
        }
        const r = new SR();
        r.lang = lang; r.continuous = false; r.interimResults = false;
        r.maxAlternatives = 3;
        r.onresult = e => onResult(e.results[0][0].transcript);
        r.onerror = () => onResult(null);
        r.onend = () => {
            Voice.stopRec();
            if(Voice._lastRec) showPlayback(Voice._lastRec);
            onEnd && onEnd();
        };
        this._recordOnly(null, true);
        r.start();
        return true;
    },
    /* 录音工具：录下麦克风音频，结束后返回 blob URL */
    _recordOnly(onEnd, silent){
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
            onEnd && onEnd(null);
            return;
        }
        let mr = null, chunks = [];
        navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
            mr = new MediaRecorder(stream);
            mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
            mr.onstop = () => {
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
                const url = URL.createObjectURL(blob);
                Voice._lastRec = url;
                if(onEnd) onEnd(url);
                if(!silent) showPlayback(url);
            };
            mr.start();
            Voice._mr = mr;
        }).catch(() => { onEnd && onEnd(null); });
        clearTimeout(Voice._mrTimer);
        Voice._mrTimer = setTimeout(() => Voice.stopRec(), 6000);
    },
    stopRec(){
        if(Voice._mr && Voice._mr.state !== 'inactive'){
            Voice._mr.stop();
        }
        Voice._mr = null;
    }
};
// 预加载语音列表（Chrome 异步加载，触发后用户首次点击即有女声）
if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
// 顺序朗读多段文字（避免互相打断）
function speakChain(parts, rate = 0.9) {
    if (!('speechSynthesis' in window)) { showToast('浏览器不支持朗读'); return; }
    window.speechSynthesis.cancel();
    let i = 0;
    function nxt() {
        if (i >= parts.length) return;
        const u = new SpeechSynthesisUtterance(parts[i]);
        u.lang = 'zh-CN'; u.rate = rate;
        u.onend = () => { i++; nxt(); };
        u.onerror = () => { i++; nxt(); };
        window.speechSynthesis.speak(u);
    }
    nxt();
}
// 中文数字归一化比较（孩子说"三"也能匹配"3"）
const CN_NUM = {0:'零',1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二',13:'十三',14:'十四',15:'十五',16:'十六',17:'十七',18:'十八',19:'十九',20:'二十'};
function answerMatches(transcript, ans) {
    if (!transcript) return false;
    const t = transcript.replace(/\s|，|。/g, '');
    const a = String(ans).replace(/\s/g, '');
    if (t.includes(a)) return true;
    if (/^\d+$/.test(a)) {
        if (CN_NUM[+a] && t.includes(CN_NUM[+a])) return true;
        if (a === '2' && t.includes('两')) return true;
    }
    return false;
}

// ================= 题库（40 课 · 6 大类） =================
// 结构: { id, type, stem, emoji, shape(bool 大字图形), answer(索引), options:[4], spoken(可选朗读文本) }

};
const CALC_IDS = ['op1','op2','op3','op4','op5','op6','op7','op8','op9','op10']; // 运算 10 课，全对解锁 math_calc

const LESSONS = [
    // ===== 数感 10 课 =====
    { id:'ns1', type:'数感', stem:'数一数，下面有几个苹果？', emoji:'🍎🍎🍎🍎🍎', options:['3','4','5','6'], answer:2 },
    { id:'ns2', type:'数感', stem:'数一数，下面有几颗星星？', emoji:'⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐', options:['13','14','15','16'], answer:2 },
    { id:'ns3', type:'数感', stem:'数一数，图中有几只小鸭子？', emoji:'🦆🦆🦆🦆🦆🦆🦆', options:['6','7','8','9'], answer:1 },
    { id:'ns4', type:'数感', stem:'5 的前面一个数是几？', emoji:'4  5  6', options:['3','4','6','7'], answer:1 },
    { id:'ns5', type:'数感', stem:'比大小：5 和 8，中间填什么？', emoji:'5  ⬜  8', options:['大于 >','小于 <','等于 =','加号 +'], answer:1 },
    { id:'ns6', type:'数感', stem:'从左数，第 3 个苹果是什么颜色？', emoji:'🍎 🍏 🍎 🍏 🍎 🍏', options:['红色','绿色','黄色','蓝色'], answer:0 },
    { id:'ns7', type:'数感', stem:'倒数：10、9、8、7，接下来是几？', emoji:'10  9  8  7  ?', options:['11','6','5','0'], answer:1 },
    { id:'ns8', type:'数感', stem:'下面哪个是双数？', emoji:'双数：2 4 6 8…', options:['3','5','6','9'], answer:2 },
    { id:'ns9', type:'数感', stem:'比 6 多 1 的数是几？', emoji:'6  ➕  1  =  ?', options:['5','6','7','8'], answer:2 },
    { id:'ns10', type:'数感', stem:'把 3、1、2 从小到大排，正确的是？', emoji:'3  1  2  ➡  ?', options:['1, 2, 3','3, 2, 1','2, 1, 3','1, 3, 2'], answer:0 },

    // ===== 运算 10 课 =====
    { id:'op1', type:'运算', stem:'5 以内加法：2 + 1 = ？', emoji:'🍎🍎  ➕  🍎  =  ?', options:['2','3','4','1'], answer:1 },

    { id:'lf4', type:'生活', stem:'购物：用 5 元买 2 元的雪糕，找回几元？', emoji:'💵5  ➖  🍦2  =  ?', options:['2 元','3 元','4 元','7 元'], answer:1 },

// ================= 状态 =================
let curIdx = 0;
const $ = id => document.getElementById(id);

function getDone() { return Store.get('math_done', []); }
function isDone(id) { return getDone().includes(id); }
function isWrong(id) { return Store.get('learn_wrong', []).some(w => w.module === 'math' && w.id === id); }

function startIdx() {
    // 优先复习错题
    const wrong = Store.get('learn_wrong', []).filter(w => w.module === 'math');
    if (wrong.length) {
        const i = LESSONS.findIndex(l => l.id === wrong[0].id);
        if (i >= 0) return i;
    }
    const last = Store.get('math_last', 0);
    return Math.min(Math.max(last, 0), LESSONS.length - 1);
}

function render() {
    const q = LESSONS[curIdx];
    const cat = CAT[q.type];
    $('cur-no').textContent = curIdx + 1;
    $('cur-cat').textContent = cat.name;
    $('cat-tag').textContent = `${cat.icon} ${cat.name}`;
    $('stem').textContent = q.stem;
    const eb = $('emoji-box');
    eb.className = 'emoji-box' + (q.shape ? ' shape' : (q.small ? ' small' : ''));
    eb.textContent = q.emoji;

    // 已完成标记
    const done = isDone(q.id);
    $('badge-done').style.display = done ? '' : 'none';

    // 选项
    $('options').innerHTML = q.options.map((o, i) =>
        `<button class="opt" data-i="${i}" onclick="select(${i})"><span class="spk">🔊</span>${o}</button>`
    ).join('');

    // 反馈重置（若已完成则显示历史结果，否则清空）
    const fb = $('feedback');
    fb.className = 'feedback';
    if (done) {
        // 标记正确项
        [...$('options').children].forEach((btn, i) => {
            if (i === q.answer) btn.classList.add('correct', 'disabled');
            else btn.classList.add('disabled');
        });
        fb.textContent = '✅ 本课已完成，可再练一次';
        fb.className = 'feedback ok';
        $('after-correct').style.display = '';
    } else {
        fb.textContent = '';
        $('after-correct').style.display = 'none';
    }

    // 导航按钮
    $('prev-btn').disabled = curIdx === 0;
    $('next-btn').disabled = false;

    // 统计
    $('stars').textContent = Store.get('learn_stars', 0);
    $('done-count').textContent = Math.min(getDone().length, 40);

    renderDots();
    Store.set('math_last', curIdx);
}

function renderDots() {
    const done = getDone();
    const wrong = Store.get('learn_wrong', []).filter(w => w.module === 'math').map(w => w.id);
    $('dots').innerHTML = LESSONS.map((l, i) => {
        let cls = 'dot';
        if (i === curIdx) cls += ' cur';
        else if (done.includes(l.id)) cls += ' done';
        else if (wrong.includes(l.id)) cls += ' wrong';
        return `<span class="${cls}" onclick="jump(${i})"></span>`;
    }).join('');
}

function jump(i) { curIdx = i; render(); }

function readStem() {
    const q = LESSONS[curIdx];
    Voice.speak(q.stem);
}

function select(i) {
    const q = LESSONS[curIdx];
    const done = isDone(q.id);
    const optText = String(q.options[i]).replace(/🔊/g, '').trim();
    if (done) {
        // 已完成，仅朗读
        Voice.speak(optText);
        return;
    }
    const btns = $('options').children;
    if (i === q.answer) {
        btns[i].classList.add('correct');
        [...btns].forEach(b => b.classList.add('disabled'));
        const fb = $('feedback');
        fb.textContent = '✅ 答对了！+1 ⭐';
        fb.className = 'feedback ok';
        // 记录
        const doneArr = getDone();
        const isNew = !doneArr.includes(q.id);
        if (isNew) {
            doneArr.push(q.id);
            Store.set('math_done', doneArr);
            Store.addProgress('math', 1);
        }
        Store.addStar(1);
        Store.dailyCheckin();
        Store.removeWrong('math', q.id);
        // 运算全对勋章
        if (q.type === '运算' && CALC_IDS.every(id => doneArr.includes(id) || id === q.id)) {
            Store.awardBadge('math_calc');
        }
        $('after-correct').style.display = '';
        $('stars').textContent = Store.get('learn_stars', 0);
        $('done-count').textContent = Math.min(getDone().length, 40);
        renderDots();
        // 朗读：选项 + 鼓励
        speakChain([optText, '答对了，真棒！']);
    } else {
        btns[i].classList.add('wrong');
        const fb = $('feedback');
        fb.textContent = '❌ 再试试';
        fb.className = 'feedback no';
        Store.addWrong('math', q.id);
        renderDots();
        speakChain([optText, '不对哦，再想想']);
        setTimeout(() => { if (btns[i]) btns[i].classList.remove('wrong'); }, 800);
    }
}

function readAnswer() {
    const q = LESSONS[curIdx];
    const ans = String(q.options[q.answer]).replace(/🔊/g, '').trim();
    speakChain(['答案是', ans, ans, '你真棒！']);
}

function kidRepeat() {
    const q = LESSONS[curIdx];
    const ans = String(q.options[q.answer]).replace(/🔊/g, '').trim();
    const mic = $('mic-btn');
    mic.classList.add('rec');
    mic.textContent = '🎤 聆听中…';
    Voice.speak('请跟读：' + ans, 'zh-CN', 0.8);
    setTimeout(() => {
        Voice.listen('zh-CN', (t) => {
            mic.classList.remove('rec');
            mic.textContent = '🎤 跟读答案';
            const fb = $('feedback');
            if (t && answerMatches(t, ans)) {
                fb.textContent = '👍 跟读正确，太厉害了！';
                fb.className = 'feedback ok';
                Voice.speak('读得真好，给你点赞！');
            } else if (t) {
                fb.textContent = '🎤 听到啦，再读一次试试～';
                fb.className = 'feedback no';
            } else {
                fb.textContent = '🎤 没听清，请再读一次';
                fb.className = 'feedback no';
            }
        }, () => {
            mic.classList.remove('rec');
            mic.textContent = '🎤 跟读答案';
        });
    }, 900);
}

function go(dir) {
    const ni = curIdx + dir;
    if (ni < 0 || ni >= LESSONS.length) return;
    curIdx = ni;
    render();
}

// 初始化
curIdx = startIdx();
render();
</script>
