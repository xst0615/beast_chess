<div class="tip">💡 建议用 Chrome 浏览器打开。点 🔊 听发音，再点 🎤 大声跟读。每天学 1-2 课，坚持就是胜利！</div>

<script>
// ================= 共享存储（与 learning_hub.html 共用 localStorage） =================
const Store = {
    get(key, def) {
        try { const v = JSON.parse(localStorage.getItem(key)); return v === null ? def : v; }
        catch (e) { return def; }
    },
    set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
    addStar(n = 1) {
        const s = (Store.get('learn_stars', 0)) + n;
        Store.set('learn_stars', s);
        return s;
    },
    addProgress(module, n = 1) {
        const p = Store.get('learn_progress', { chinese: 0, pinyin: 0, math: 0, english: 0 });
        p[module] = (p[module] || 0) + n;
        Store.set('learn_progress', p);
        return p;
    },
    addWrong(module, id) {
        const w = Store.get('learn_wrong', []);
        if (!w.find(x => x.module === module && x.id === id)) {
            w.push({ module, id, addedAt: Date.now() });
            Store.set('learn_wrong', w);
        }
    },
    removeWrong(module, id) {
        const w = Store.get('learn_wrong', []).filter(x => !(x.module === module && x.id === id));
        Store.set('learn_wrong', w);
    },
    dailyCheckin() {
        const s = Store.get('learn_streak', { days: 0, lastDate: null });
        const today = new Date().toDateString();
        if (s.lastDate === today) return s;
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        s.days = (s.lastDate === yesterday) ? s.days + 1 : 1;
        s.lastDate = today;
        Store.set('learn_streak', s);
        return s;
    },
    awardBadge(id) {
        const b = Store.get('learn_badges', []);
        if (!b.includes(id)) { b.push(id); Store.set('learn_badges', b); }
    },
};

// ================= 语音工具（TTS + 识别，均 en-US） =================
const Voice = {
    speak(text, lang = 'en-US', rate = 0.8) {
        if (!('speechSynthesis' in window)) { alert('请用 Chrome 浏览器以获得语音'); return false; }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang; u.rate = rate;
        window.speechSynthesis.speak(u);
        return true;
    },
    listen(lang = 'en-US', onResult, onEnd) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert('请用 Chrome 浏览器以使用跟读'); onResult(null); return false; }
        const r = new SR();
        r.lang = lang; r.continuous = false; r.interimResults = false;
        r.maxAlternatives = 3;
        r.onresult = e => onResult(e.results[0][0].transcript);
        r.onerror = () => onResult(null);
        r.onend = () => onEnd && onEnd();
        r.start();
        return true;
    },
    score(target, heard) {
        if (!heard) return 0;
        const t = target.toLowerCase(), h = heard.toLowerCase();
        if (h.includes(t) || t.includes(h)) return 2;
        const common = [...t].filter(c => h.includes(c)).length;
        return common / Math.max(1, t.length) > 0.6 ? 1 : 0;
    }
};

// ================= 课程内容（26 字母 + 50 单词 + 6 问候 = 82 项） =================
// 1) 字母 26 课（每课一个字母 + 例词）

    { u: 'W', l: 'w', p: '/ˈdʌb.əl.juː/',  w: 'Watch',     e: '⌚', c: '手表' },
    { u: 'X', l: 'x', p: '/ɛks/',          w: 'Fox',       e: '🦊', c: '狐狸' },
    { u: 'Y', l: 'y', p: '/waɪ/',          w: 'Yo-yo',     e: '🪀', c: '悠悠球' },
    { u: 'Z', l: 'z', p: '/ziː/',          w: 'Zebra',     e: '🦓', c: '斑马' },

// 2) 常用单词 50 个，合并成 8 课（数字拆成 1-5 / 6-10 两课）
const WORD_GROUPS = [
    { title: '动物 Animals', items: [

        { en: 'cat',    e: '🐱', c: '猫' },

    ]},
    { title: '颜色 Colors', items: [
        { en: 'red',    e: '🔴', c: '红' },

    ]},

        { en: 'nine',  e: '9️⃣', c: '九' },
        { en: 'ten',   e: '🔟', c: '十' },
    ]},
    { title: '家庭 Family', items: [
        { en: 'father',  e: '👨', c: '爸爸' },

// 3) 简单问候 6 课
const GREETINGS = [
    { en: 'Hello',        alt: 'Hi',   c: '你好',  emoji: '👋', scene: '见面打招呼时说',  dialogue: 'A: Hello! 👋<br>B: Hi! 👋' },
    { en: 'Good morning', alt: '',     c: '早上好', emoji: '☀️', scene: '早晨见面时说',    dialogue: 'A: Good morning! ☀️<br>B: Good morning!' },

    { en: 'Thank you',    alt: '',     c: '谢谢',  emoji: '🎁', scene: '收到帮助或礼物时说', dialogue: "A: Thank you! 🎁<br>B: You're welcome!" },
    { en: 'Sorry',        alt: '',     c: '对不起', emoji: '😅', scene: '做错事时说',       dialogue: "A: Sorry! 😅<br>B: That's OK!" },

// 拼装 40 课
const LESSONS = [];
LETTERS.forEach(L => LESSONS.push(Object.assign({ type: 'letter' }, L)));
WORD_GROUPS.forEach(G => LESSONS.push({ type: 'words', title: G.title, items: G.items }));
GREETINGS.forEach(G => LESSONS.push(Object.assign({ type: 'greeting' }, G)));

// 所有单词池（用于看图认词的干扰项）
const ALL_WORDS = WORD_GROUPS.flatMap(G => G.items);

// ================= 状态 =================
let lessonIdx = 0;   // 0..39
let wordIdx = 0;     // 单词课内的词序号
let readToken = 0;   // 用于丢弃过期的语音回调

const $ = id => document.getElementById(id);

// ================= 进度记录 =================
function markDone(itemId) {
    const done = Store.get('english_done', []);
    if (!done.includes(itemId)) {
        done.push(itemId);
        Store.set('english_done', done);
        Store.addProgress('english', 1);
        const p = Store.get('learn_progress', { chinese: 0, pinyin: 0, math: 0, english: 0 });
        if (p.english >= 30) Store.awardBadge('english_30');
    }
}
function greetingId(en) { return 'greeting_' + en.replace(/\s/g, '_'); }

// ================= 渲染 =================
function render() {
    readToken++; // 取消任何在途的语音回调
    const L = LESSONS[lessonIdx];
    const typeNames = { letter: '字母 Letter', words: '单词 Word', greeting: '问候 Greeting' };
    let html = '';

    if (L.type === 'letter') {
        html = `
        <div class="big-letter">${L.u}<span class="lc">${L.l}</span></div>
        <div class="phonetic">字母发音：${L.p}</div>
        <div class="example-box">
            <div class="ex-emoji">${L.e}</div>
            <div class="ex-line">${L.w} <span class="ex-cn">${L.c}</span></div>
        </div>
        <div class="actions">
            <button class="btn btn-speak" onclick="speak('${L.u}')">🔊 听字母</button>
            <button class="btn btn-read" onclick="readLetter()">🎤 跟读字母</button>
        </div>
        <div class="actions">
            <button class="btn btn-speak" onclick="speak('${L.w}')">🔊 听例词</button>
            <button class="btn btn-read" onclick="readLetterWord()">🎤 跟读例词</button>
        </div>`;
    } else if (L.type === 'words') {
        const it = L.items[wordIdx];
        html = `
        <div class="group-title">${L.title} · 第 ${wordIdx + 1} / ${L.items.length} 词</div>
        <div class="big-emoji">${it.e}</div>
        <div class="big-en">${it.en}</div>
        <div class="cn">${it.c}</div>
        <div class="actions">
            <button class="btn btn-speak" onclick="speak('${it.en}')">🔊 听发音</button>
            <button class="btn btn-read" onclick="readWord()">🎤 跟读</button>
            <button class="btn btn-quiz" onclick="startQuiz()">🎲 看图认词</button>
        </div>
        <div class="quiz" id="quiz"></div>`;
    } else { // greeting
        html = `
        <div class="big-emoji">${L.emoji}</div>
        <div class="big-en">${L.en}</div>
        <div class="cn">${L.c}</div>
        ${L.alt ? `<div class="alt">也可以说：<b>${L.alt}</b></div>` : ''}
        <div class="scene">📍 场景：${L.scene}</div>
        <div class="dialogue">${L.dialogue}</div>
        <div class="actions">
            <button class="btn btn-speak" onclick="speak('${L.en}')">🔊 听发音</button>
            <button class="btn btn-read" onclick="readGreeting()">🎤 跟读</button>
        </div>`;
    }
    html += `<div class="feedback" id="fb"></div>`;
    $('stage').innerHTML = html;

    const lessonNum = lessonIdx + 1;
    let typeLabel = typeNames[L.type];
    if (L.type === 'words') typeLabel += ' · ' + L.title;
    $('header').innerHTML = `第 <b>${lessonNum}</b> / 40 课 · ${typeLabel}`;

    updateTopbar();
    autoSpeak();
}

function updateTopbar() {
    const stars = Store.get('learn_stars', 0);
    const done = Store.get('english_done', []).length;
    const wrong = Store.get('learn_wrong', []).filter(w => w.module === 'english').length;
    $('topbar').innerHTML = `
        <div class="ti"><div class="v">${stars}</div><div class="k">⭐ 星星</div></div>
        <div class="sep"></div>
        <div class="ti"><div class="v">${done}/82</div><div class="k">✅ 已掌握</div></div>
        <div class="sep"></div>
        <button class="wrong-btn" onclick="reviewWrong()">📌 错题 ${wrong}</button>`;
}

function setFeedback(msg, cls) {
    const fb = $('fb');
    if (!fb) return;
    fb.textContent = msg;
    fb.className = 'feedback ' + (cls || '');
}

// ================= 语音动作 =================
function speak(text) { Voice.speak(text, 'en-US', 0.8); }

function onRead(target, itemId, countProgress) {
    const token = ++readToken;
    setFeedback('🎤 正在听…请大声读出来', 'listen');
    Voice.listen('en-US', (heard) => {
        if (token !== readToken) return; // 已切换到其它内容，丢弃
        if (heard === null) {
            setFeedback('❌ 没听清，点 🔊 再听一遍，然后 🎤 跟读', 'bad');
            Store.addWrong('english', itemId);
            updateTopbar();
            return;
        }
        const sc = Voice.score(target, heard);
        if (sc === 2) {
            setFeedback('✅ 太棒了！读对了：' + target, 'good');
            Store.addStar(1);
            if (countProgress) markDone(itemId);
            Store.removeWrong('english', itemId);
            Store.dailyCheckin();
        } else if (sc === 1) {
            setFeedback('🟡 差一点点！你读成了 “' + heard + '”，再试一次', 'mid');
            Store.addWrong('english', itemId);
        } else {
            setFeedback('❌ 没读对哦，你读成了 “' + heard + '”，再听一遍再读', 'bad');
            Store.addWrong('english', itemId);
        }
        updateTopbar();
    });
}

function readLetter()     { const L = LESSONS[lessonIdx]; onRead(L.u, 'letter_' + L.u, true); }
function readLetterWord() { const L = LESSONS[lessonIdx]; onRead(L.w.toLowerCase(), 'lword_' + L.u, false); }
function readWord()       { const L = LESSONS[lessonIdx], it = L.items[wordIdx]; onRead(it.en, 'word_' + it.en, true); }
function readGreeting()   { const L = LESSONS[lessonIdx]; onRead(L.en, greetingId(L.en), true); }

// 进入新课/新词自动朗读
function autoSpeak() {
    const L = LESSONS[lessonIdx];
    let text;
    if (L.type === 'letter') text = L.u;
    else if (L.type === 'words') text = L.items[wordIdx].en;
    else text = L.en;
    setTimeout(() => Voice.speak(text, 'en-US', 0.8), 350);
}

// ================= 看图认词小测验 =================
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function startQuiz() {
    const L = LESSONS[lessonIdx];
    if (L.type !== 'words') return;
    const correct = L.items[wordIdx];
    const pool = ALL_WORDS.filter(w => w.en !== correct.en);
    const distractors = shuffle(pool).slice(0, 3);
    const choices = shuffle([correct, ...distractors]);
    $('quiz').innerHTML =
        `<div class="quiz-q">看图选词：${correct.e} 的英文是？</div>
         <div class="quiz-choices">${choices.map(c =>
            `<button class="qc" onclick="answerQuiz('${c.en}','${correct.en}')">${c.en}</button>`
         ).join('')}</div>`;
}
function answerQuiz(picked, correct) {
    if (picked === correct) {
        $('quiz').innerHTML = `<div class="quiz-ok">✅ 答对啦！太棒了！</div>`;
        Store.addStar(1);
        markDone('word_' + correct);
        Store.removeWrong('english', 'word_' + correct);
        Store.dailyCheckin();
    } else {
        $('quiz').innerHTML = `<div class="quiz-no">❌ 再想想，正确答案是 <b>${correct}</b></div>`;
        Store.addWrong('english', 'word_' + correct);
    }
    updateTopbar();
    setTimeout(() => { const q = $('quiz'); if (q) q.innerHTML = ''; }, 2600);
}

// ================= 错题复习 =================
function reviewWrong() {
    const wrong = Store.get('learn_wrong', []).filter(w => w.module === 'english');
    if (!wrong.length) { alert('英语错题本空空如也，继续保持！'); return; }
    const id = wrong[0].id;
    for (let i = 0; i < LESSONS.length; i++) {
        const L = LESSONS[i];
        if (L.type === 'letter') {
            if ('letter_' + L.u === id) { lessonIdx = i; wordIdx = 0; render(); return; }
        } else if (L.type === 'words') {
            for (let j = 0; j < L.items.length; j++) {
                if ('word_' + L.items[j].en === id) { lessonIdx = i; wordIdx = j; render(); return; }
            }
        } else if (L.type === 'greeting') {
            if (greetingId(L.en) === id) { lessonIdx = i; wordIdx = 0; render(); return; }
        }
    }
    alert('该错题不在课程内，已自动忽略。');
}

// ================= 导航 =================
function next() {
    const L = LESSONS[lessonIdx];
    if (L.type === 'words' && wordIdx < L.items.length - 1) {
        wordIdx++;
    } else {
        if (lessonIdx < LESSONS.length - 1) { lessonIdx++; wordIdx = 0; }
        else { alert('🎉 全部 40 课学完啦！你太棒了！'); return; }
    }
    render();
}
function prev() {
    const L = LESSONS[lessonIdx];
    if (L.type === 'words' && wordIdx > 0) {
        wordIdx--;
    } else {
        if (lessonIdx > 0) {
            lessonIdx--;
            const P = LESSONS[lessonIdx];
            wordIdx = P.type === 'words' ? P.items.length - 1 : 0;
        }
    }
    render();
}

// ================= 启动 =================
render();
</script>
</body>
</html>
